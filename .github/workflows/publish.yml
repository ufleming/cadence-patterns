name: Publish protocol package
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose protocol content is published (e.g. v0.2.1)
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@ufleming'
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e 'const p=require("./package.json");if(process.env.RELEASE_TAG!=="v"+p.version||p.private!==false||p.publishConfig?.registry!=="https://npm.pkg.github.com")process.exit(1)'
          # The published protocol content must be exactly the released tag's content.
          git diff --exit-code "refs/tags/$RELEASE_TAG" HEAD -- README.md CHANGELOG.md LICENSE manifest.json concepts patterns templates docs scripts/validate.mjs
          gh release view "$RELEASE_TAG" --json tagName,isDraft --jq 'select(.isDraft==false).tagName' | grep -qx "$RELEASE_TAG"
        shell: bash
      - run: npm test
      - run: mkdir -p .tmp && npm pack --pack-destination .tmp
      - name: Publish checked archive
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish .tmp/*.tgz --registry=https://npm.pkg.github.com --ignore-scripts
      - name: Verify registry identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-registry.mjs .tmp/*.tgz
      - name: Verify package visibility follows the repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          gh api users/ufleming/packages/npm/cadence-patterns --jq '{name,visibility,package_type,repository:.repository.full_name}' > .tmp/patterns-visibility.json
          cat .tmp/patterns-visibility.json
          node -e 'const p=require("./.tmp/patterns-visibility.json"); const want=process.env.REPOSITORY_VISIBILITY; if(!want||p.visibility!==want||p.package_type!=="npm"||p.name!=="cadence-patterns"||p.repository!=="ufleming/cadence-patterns") throw Error("Unexpected package visibility or identity: "+JSON.stringify(p)+" expected visibility "+want); console.log("visibility ok: "+p.visibility);'
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            .tmp/*.tgz
            .tmp/registry-dist.json
            .tmp/patterns-visibility.json
          if-no-files-found: error
          include-hidden-files: true
